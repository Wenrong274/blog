{{ $limit := default 5 .Params.limit }}
{{ $pages := where .Context.Site.RegularPages "Section" "posts" }}
{{ $pages = $pages | first $limit }}

<div class="widget latest-posts-widget">
    <div class="widget-icon">
        {{ partial "helper/icon" "hash" }}
    </div>
    <h2 class="widget-title section-title">最新文章</h2>
    <ul class="latest-posts-list">
        {{ range $pages }}
        <li>
            <a href="{{ .Permalink }}">{{ .Title }}</a>
            <span class="post-date">{{ .Date.Format "2006-01-02" }}</span>
        </li>
        {{ end }}
    </ul>
</div>

<style>
.latest-posts-list {
    list-style: none;
    padding: 0;
    margin: 0;
}
.latest-posts-list li {
    padding: 6px 0;
    border-bottom: 1px solid var(--card-separator-color);
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.latest-posts-list li:last-child {
    border-bottom: none;
}
.latest-posts-list a {
    font-size: 1.4rem;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.post-date {
    font-size: 1.2rem;
    color: var(--body-text-color);
    opacity: 0.6;
}
</style>
