name: GitHub Pages

on:
  push:
    branches:
      - main # Set a branch to deploy
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Markdownlint
        run: npx markdownlint-cli2

  deploy:
    runs-on: ubuntu-22.04
    needs: lint
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: resources/
          key: ${{ runner.os }}-hugo-resources-${{ hashFiles('assets/**', 'content/**') }}
          restore-keys: |
            ${{ runner.os }}-hugo-resources-

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.161.1"
          extended: true

      - name: Build
        run: hugo --minify

      - name: Install http-server
        run: sudo npm install -g http-server

      - name: Lighthouse audit
        run: |
          http-server ./public -p 8080 &
          npx wait-on http://localhost:8080 --timeout 30000
          npx @lhci/cli@0.14.x autorun \
            --collect.url=http://localhost:8080/ \
            --collect.url=http://localhost:8080/posts/ \
            --upload.target=temporary-public-storage \
            --collect.settings.chromeFlags="--no-sandbox"
        continue-on-error: true

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages # 推送到 gh-pages 分支
          commit_message: ${{ github.event.head_commit.message }}
          publish_dir: ./public
          cname: wenrong-nexus.com
